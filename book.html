<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Table | Grill Yard</title>

<link rel="stylesheet" href="book.css">
<link rel="stylesheet" href="media.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="booking-container">

<h1>🍽 Reserve Your Table</h1>

<p class="subtitle">
Book your table now and enjoy delicious food with your family and friends.
</p>

<form>

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Phone Number" required>

<input type="email" placeholder="Email Address">

<input type="number" placeholder="Number of Guests" min="1" required>

<input type="date" required>

<input type="time" required>

<select required>

<option>Select Table Type</option>

<option>Indoor Table</option>

<option>Outdoor Table</option>

<option>Family Table</option>

<option>VIP Table</option>

</select>

<textarea placeholder="Special Request (Optional)"></textarea>

<button type="submit">
Confirm Booking
</button>

</form>

</div>

</body>
</html>
